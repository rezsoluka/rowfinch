name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1 libfreetype6 libice6 libsm6
      - name: Restore
        run: dotnet restore Rowfinch.slnx
      - name: Build
        run: dotnet build Rowfinch.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Rowfinch.slnx --configuration Release --no-build
